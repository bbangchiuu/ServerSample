# Hạ tầng cho môi trường DEV (dùng từ giai đoạn 3). Mật khẩu ở đây chỉ dùng trên máy cá nhân.
#   docker compose up -d      # khởi động
#   docker compose down       # tắt (dữ liệu vẫn còn trong volume)
#   docker compose down -v    # tắt và XÓA dữ liệu
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-game}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
